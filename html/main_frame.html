		function setScreenSize() {
			//console.log("setScreenSize() => " + document.querySelector('.title').offsetHeight);
			
			let title_heigt = document.querySelector('.title').offsetHeight;			
			let vh = (window.innerHeight - getNavBarHeight() - 2 - title_heigt) * 0.01;
			
			document.documentElement.style.setProperty('--vh', `${vh}px`);

			document.getElementById('control').classList.remove('menu-selected');
			document.getElementById('data').classList.remove('menu-selected');
