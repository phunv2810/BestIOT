<!doctype html>
<html>
<head>

	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=0.5, minimum-scale=0, maximum-scale=2.0">
	<meta name="mobile-web-app-capable" content="yes">

	<link rel="shotcut icon" href="./img/shotcut_icon.ico" type="image/x-icon">

	<input type='hidden' id='session_id' value='admin'/><input type='hidden' id='session_lv' value=''/>

	<title>고도리 스마트팜</title>

	<script type="text/javascript" src="/js/jQuery.min.js"></script>

	<script type="text/javascript">
		$(document).ready(function(){
			setScreenSize();

			$("#menu").click(function(){
				if(confirm("작업을 종료하고 창을 닫겠습니까?")){		
					window.open('about:blank', '_self').selft.close();
					window.open('', '_self');
					window.close();
				}
			});
			
			$("#control").click(function(){
				$("#mainframe").attr('src', "manual_control.html");
				remove_selectedClass();
				document.getElementById('control').classList.add('menu-selected');
			});
			$("#data").click(function(){
				$("#mainframe").attr('src', "view_data.html");
				remove_selectedClass();
				document.getElementById('data').classList.add('menu-selected');
			});
			$("#config").click(function(){
				$("#mainframe").attr('src', "set_config.html");
				remove_selectedClass();
				document.getElementById('config').classList.add('menu-selected');
			});
			
			// iframe internal message
			window.addEventListener("message", function(message){
				if(message.data == "암호변경"){
					location.href = "/html/login.html";
				}
			});
		});

		$(window).resize(function(){
			setScreenSize();
		});

		function setScreenSize() {
			let title_heigt = document.querySelector('.title').offsetHeight;			
			let vh = (window.innerHeight - getNavBarHeight() - 2 - title_heigt) * 0.01;
			document.documentElement.style.setProperty('--vh', `${vh}px`);
		};

		function getNavBarHeight(){
			return document.querySelector('nav').offsetHeight;
		};

		function remove_selectedClass(){
			document.getElementById('control').classList.remove('menu-selected');
			document.getElementById('data').classList.remove('menu-selected');
			document.getElementById('config').classList.remove('menu-selected');
		}
	</script>

    <link rel="stylesheet" href="css/main.css"/>

</head>

<body>

	<!-- Top Red Header -->
	<div class="title">
		<button class="header-power-btn" id="menu" title="Exit">
			<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
				<path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
				<line x1="12" y1="2" x2="12" y2="12"></line>
			</svg>
		</button>
		<div class="header-title-wrapper">
			<svg width="34" height="26" viewBox="0 0 40 30" fill="#FFFFFF">
				<path d="M10 26 C15 18 26 12 37 10 C28 16 18 20 12 28 Z"></path>
				<path d="M2 13 C9 9 22 7 35 5 C22 10 11 16 3 20 Z"></path>
			</svg>
			<span class="title_text">고도리 스마트팜</span>
		</div>
	</div>

	<!-- Main Frame (loads manual_control.html) -->
	<div class="mframe">
		<iframe src="/html/manual_control.html" style="width:100%;height:100%;border:0px;top:0px;left:0px;" id="mainframe"></iframe>
	</div>

	<!-- Bottom Navigation Bar -->
	<nav>
		<span class="nav-menu menu-selected" id="control">
			<div class="icon-wrapper">
				<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<path d="M5.5 10.4a7 7 0 1 1 13 0"></path>
					<path d="M8.5 9.6a4 4 0 1 1 7 0"></path>
					<path d="M10.5 15V7.5a1.5 1.5 0 0 1 3 0v4.5h1.5a1 1 0 0 1 1 1v.3h1.5a1 1 0 0 1 1 1v.3h1a1 1 0 0 1 1 1v3.6c0 2.3-1.9 4.2-4.2 4.2H12c-1.6 0-3.2-.8-4.2-2.2l-3.2-3.8a1.4 1.4 0 0 1 .2-2l.6-.5a1.4 1.4 0 0 1 2 .2l1.9 2.2"></path>
				</svg>
			</div>
			<div class="nav-label">Control</div>
		</span>

		<span class="nav-menu" id="data">
			<div class="icon-wrapper">
				<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<path d="M3 3v16a2 2 0 0 0 2 2h16"></path>
					<path d="m7 15 4.5-4.5 3.5 3.5 6-7"></path>
					<path d="M15 7h6v6"></path>
				</svg>
			</div>
			<div class="nav-label">Data</div>
		</span>

		<span class="nav-menu" id="config">
			<div class="icon-wrapper">
				<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065"></path>
					<path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"></path>
				</svg>
			</div>
			<div class="nav-label">Setting</div>
		</span>
	</nav>

</body>
</html>
