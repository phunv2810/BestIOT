<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="mobile-web-app-capable" content="yes">

	<link rel="shortcut icon" href="./img/shotcut_icon.ico" type="image/x-icon">

	<title>고도리 스마트팜</title>

	<link rel="stylesheet" href="./css/login.css?v=1.00">

	<script type="text/javascript" src="/js/jQuery.min.js"></script>
	<script type="text/javascript" src="/js/jquery.cookie-1.4.1.min.js"></script>
	<script class="include" type="text/javascript" src="/js/login.js?v=1.00"></script>
</head>

<body>
<div class="bgscreen">
	<div class="wrapper">
		<div class="form-box">
			<!-- Crimson Top Header with Logo -->
			<div class="card-header">
				<svg class="header-logo" width="40" height="30" viewBox="0 0 85 62" fill="#FFFFFF" xmlns="http://www.w3.org/2000/svg">
					<!-- Top leaf / plume -->
					<path d="M 78 3 C 78 9 77 15 75 19 C 71 25 65 30 57 34 C 50 38 45 42 43 45 C 43 42 45 35 48 29 C 52 23 60 16 68 11 C 73 8 76 5 78 3 Z"/>
					<!-- Bottom sweeping wing / tail -->
					<path d="M 5 30 C 12 43 23 53 37 56 C 43 56 48 55 51 55 C 45 53 35 50 28 42 C 22 36 16 31 5 30 Z"/>
					<!-- Middle right leaf -->
					<path d="M 78 32 C 79 33 77 37 74 41 C 69 46 62 49 45 49 C 50 44 55 39 63 36 C 69 34 75 33 78 32 Z"/>
				</svg>
				<span class="header-title">고도리 스마트팜</span>
			</div>

			<!-- Main Form Body -->
			<form class="form" onsubmit="return false;">
				<!-- User ID Field -->
				<div class="form-group">
					<label class="form-label" for="input_id">User ID</label>
					<div class="input-container">
						<span class="input-icon">
							<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
								<path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
							</svg>
						</span>
						<input type="text" class="input-field input" placeholder="Enter your user ID" id="input_id" autocomplete="username">
					</div>
				</div>

				<!-- Password Field -->
				<div class="form-group">
					<label class="form-label" for="input_pw">Password</label>
					<div class="input-container">
						<span class="input-icon">
							<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
								<path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
							</svg>
						</span>
						<input type="password" class="input-field input" placeholder="Enter your password" id="input_pw" autocomplete="current-password">
						<button type="button" class="toggle-pw-btn" id="toggle_pw" aria-label="Toggle password visibility">
							<svg id="eye_icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
								<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
								<line x1="1" y1="1" x2="23" y2="23"></line>
							</svg>
						</button>
					</div>
				</div>

				<!-- Remember my ID Checkbox -->
				<div class="remember-row">
					<label class="checkbox-label" for="save_id">
						<input type="checkbox" name="save_id" id="save_id" value="save_id">
						<span>Remember my ID</span>
					</label>
				</div>

				<!-- Login Button -->
				<button type="button" id="connect" class="btn-login">Login</button>

				<!-- Connection Information Box -->
				<div class="connection_info">
					<div class="info-row">
						<span class="info-label">Your IP</span>
						<input name="ipaddr" type="text" id="ipaddr" value="182.217.148.34" disabled class="info-input">
					</div>
					<div class="info-row">
						<span class="info-label">Login Count</span>
						<input name="con_count" type="text" id="con_count" value="10" disabled class="info-input">
					</div>
					<div class="info-row">
						<span class="info-label">Login Error</span>
						<input name="con_error" type="text" id="con_error" value="0" disabled class="info-input">
					</div>
					<div class="info-warning">Locked after 5 failed attempts</div>
				</div>
			</form>

			<!-- Bottom Footer Section -->
			<div class="form-section">
				<p>Don't have an account? <a href="join.html" class="signup-link" style="pointer-events: none">Sign Up</a></p>
			</div>
		</div>
	</div>
</div>
</body>
</html>
